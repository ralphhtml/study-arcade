<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Arcade</title>
<style>
  :root { --bg:#0b0f17; --panel:#151b27; --line:#232c3d; --text:#e8ecf4; --muted:#8a93a8; --accent:#3aa6ff; --fav:#ffb84d; --ok:#3ecf8e; --danger:#c62839; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg:#f4f6fb; --panel:#ffffff; --line:#dde2ee; --text:#18202e; --muted:#5d6780; }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  button, input { font:inherit; }
  .hidden { display:none !important; }

  /* Library */
  #library { min-height:100%; display:flex; flex-direction:column; }
  header { position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--line); padding:10px 14px; }
  .top { display:flex; align-items:center; gap:8px; }
  .top h1 { font-size:17px; margin:0; flex:1; }
  .top small { display:block; color:var(--muted); font-size:12px; font-weight:normal; }
  .btn { border:1px solid var(--line); background:transparent; color:var(--text); padding:7px 11px; border-radius:999px; cursor:pointer; font-size:13px; white-space:nowrap; }
  .btn.primary { background:var(--ok); color:#06210f; border-color:var(--ok); font-weight:600; }
  .btn.danger { background:var(--danger); color:#fff; border-color:var(--danger); font-weight:600; }
  .btn.on { border-color:var(--accent); background:rgba(58,166,255,.14); }
  .row { display:flex; gap:8px; margin-top:10px; }
  #search { flex:1; min-width:0; padding:10px 12px; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:8px; font-size:16px; }
  .tabs { display:flex; gap:6px; margin-top:10px; overflow-x:auto; padding-bottom:2px; }
  .tabs .btn { flex:0 0 auto; }
  .count { color:var(--muted); font-size:12px; margin:0 0 4px; }
  main { padding:14px; max-width:1200px; width:100%; margin:0 auto; flex:1; }
  h2 { font-size:16px; margin:18px 0 10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; position:relative; color:var(--text); padding:0; text-align:left; }
  .card:hover, .card:focus-visible { border-color:var(--accent); outline:none; }
  .thumb { width:100%; aspect-ratio:4/3; background:#1d2535; display:block; object-fit:cover; opacity:0; transition:opacity .3s; }
  .thumb.loaded { opacity:1; }
  .card .name { padding:7px 9px 2px; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .sub { padding:0 9px 9px; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .star { position:absolute; top:6px; right:6px; font-size:16px; color:var(--fav); background:rgba(0,0,0,.45); border-radius:6px; padding:0 4px; }
  .pop { position:absolute; top:6px; left:6px; font-size:10px; font-weight:700; background:var(--accent); color:#fff; padding:2px 6px; border-radius:4px; }
  .empty { color:var(--muted); font-style:italic; padding:20px 0; }
  .more { display:block; margin:16px auto; }
  .foot { color:var(--muted); font-size:12px; text-align:center; padding:20px 10px 30px; }

  /* Player */
  #player { position:fixed; inset:0; background:#000; display:flex; flex-direction:column; z-index:10; }
  #player.hidden { display:none !important; }
  .ptop { display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--panel); border-bottom:1px solid var(--line); }
  .ptop .title { flex:1; font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .frame-wrap { flex:1; position:relative; background:#000; }
  .frame-wrap iframe { z-index:1; position:absolute; inset:0; width:100%; height:100%; border:0; }
  .cover { position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:var(--bg); color:var(--text); text-align:center; padding:20px; }
  .cover img { max-width:min(360px,80%); border-radius:12px; border:1px solid var(--line); }
  .cover .btn { font-size:16px; padding:11px 26px; }
</style>
</head>
<body>

<div id="library">
  <header>
    <div class="top">
      <h1>Study Arcade<small id="status">Loading games…</small></h1>
      <button class="btn" id="resetBtn" title="Clear saved progress">Reset</button>
      <button class="btn danger" id="quickExit">Quick Exit</button>
    </div>
    <div class="row">
      <input id="search" type="search" placeholder="Search games ( / )" aria-label="Search games">
      <button class="btn" id="randomBtn" title="Random (R)">Random</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="btn on" data-f="all">All</button>
      <button class="btn" data-f="popular">Popular</button>
      <button class="btn" data-f="favorites">Favorites</button>
      <button class="btn" data-f="recent">Recent</button>
    </div>
  </header>
  <main>
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
    <button class="btn more hidden" id="moreBtn">Show more</button>
    <div class="foot">Plays, favorites and recent games are saved in this browser. F = fullscreen.</div>
  </main>
</div>

<div id="player" class="hidden">
  <div class="ptop">
    <button class="btn" id="backBtn">← Back</button>
    <div class="title" id="pTitle"></div>
    <button class="btn" id="pFav">☆ Favorite</button>
    <button class="btn" id="pFull" title="Fullscreen (F)">Fullscreen</button>
  </div>
  <div class="frame-wrap">
    <div class="cover" id="cover">
      <img id="pThumb" alt="">
      <div id="pPlays" style="color:var(--muted);font-size:13px"></div>
      <button class="btn primary" id="playBtn">Play</button>
    </div>
    <iframe id="frame" allow="fullscreen; autoplay; gamepad" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
</div>

    id: g.l, name: g.n, popular: !!g.p,
    game: SITE + '/_lessons/' + g.l,
    thumb: SITE + '/_lessonr/' + g.l + '.webp'
  }));
  const BY_ID = Object.fromEntries(GAMES.map(g => [g.id, g]));
  const PAGE = 60;

  let saved = load();
  let filter = 'all';
  let query = '';
  let shown = PAGE;
  let current = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const p = JSON.parse(raw); return { games: p.games || {}, recent: p.recent || [] }; }
    } catch (e) {}
    return { games: {}, recent: [] };
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(saved)); }
    catch (e) { toast('Could not save progress in this browser'); }
  }
  function info(id) {
    return saved.games[id] || (saved.games[id] = { plays: 0, fav: false, last: 0 });
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  function visible() {
    const q = query.trim().toLowerCase();
    let list;
    if (filter === 'recent') {
      list = saved.recent.map(id => BY_ID[id]).filter(Boolean);
    } else {
      list = GAMES.filter(g => {
        if (filter === 'popular' && !g.popular) return false;
        if (filter === 'favorites' && !(saved.games[g.id] && saved.games[g.id].fav)) return false;
        return true;
      });
    }
    if (q) list = list.filter(g => g.name.toLowerCase().includes(q));
    return list;
  }

  function card(g) {
    const i = saved.games[g.id] || {};
    return `<button class="card" data-id="${g.id}" aria-label="${esc(g.name)}">
      <img class="thumb" data-src="${g.thumb}" alt="" loading="lazy">
      ${g.popular ? '<span class="pop">HOT</span>' : ''}
      ${i.fav ? '<span class="star">★</span>' : ''}
      <div class="name">${esc(g.name)}</div>
      <div class="sub">${i.plays ? 'Played ' + i.plays + '×' : 'Not played yet'}</div>
    </button>`;
  }

  function render() {
    const list = visible();
    const slice = list.slice(0, shown);
    document.getElementById('grid').innerHTML = slice.map(card).join('');
    document.getElementById('count').textContent = list.length + ' game' + (list.length === 1 ? '' : 's');
    document.getElementById('moreBtn').classList.toggle('hidden', list.length <= shown);
    document.getElementById('status').textContent = GAMES.length + ' games · ' + Object.keys(saved.games).length + ' with progress';
    if (!list.length) document.getElementById('grid').innerHTML = '<p class="empty">No games match this view.</p>';
    bindImages();
  }

  // Lazy-load thumbnails; fall back to hiding the image if it fails.
  const io = ('IntersectionObserver' in window) ? new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const img = en.target;
      img.onload = () => img.classList.add('loaded');
      img.onerror = () => { img.style.display = 'none'; };
      img.src = img.dataset.src;
      io.unobserve(img);
    });
  }, { rootMargin: '200px' }) : null;
  function bindImages() {
    document.querySelectorAll('#grid .thumb').forEach(img => {
      if (io) io.observe(img); else { img.src = img.dataset.src; img.classList.add('loaded'); }
    });
  }

  function openGame(id) {
    const g = BY_ID[id];
    if (!g) return;
    current = g;
    const i = info(id);
    document.getElementById('pTitle').textContent = g.name;
    document.getElementById('pThumb').src = g.thumb;
    document.getElementById('pPlays').textContent = (i.plays ? 'Played ' + i.plays + ' time' + (i.plays === 1 ? '' : 's') : 'Not played yet');
    document.getElementById('pFav').textContent = i.fav ? '★ Favorited' : '☆ Favorite';
    document.getElementById('frame').removeAttribute('src');
    document.getElementById('cover').classList.remove('hidden');
    document.getElementById('player').classList.remove('hidden');
  }

  function startGame() {
    if (!current) return;
    const i = info(current.id);
    i.plays += 1;
    i.last = Date.now();
    saved.recent = [current.id].concat(saved.recent.filter(x => x !== current.id)).slice(0, 20);
    persist();
    document.getElementById('frame').src = current.game;
    document.getElementById('cover').classList.add('hidden');
    document.getElementById('frame').focus();
  }

  function closePlayer() {
    document.getElementById('frame').removeAttribute('src');
    document.getElementById('player').classList.add('hidden');
    current = null;
    render();
  }

  function toggleFav() {
    if (!current) return;
    const i = info(current.id);
    i.fav = !i.fav;
    persist();
    document.getElementById('pFav').textContent = i.fav ? '★ Favorited' : '☆ Favorite';
  }

  function randomGame() {
    const list = visible();
    const pool = list.length ? list : GAMES;
    openGame(pool[Math.floor(Math.random() * pool.length)].id);
  }

  function toggleFullscreen() {
    const el = document.getElementById('player');
    if (!document.fullscreenElement) el.requestFullscreen?.(); else document.exitFullscreen?.();
  }

  let toastTimer;
  function toast(msg) {
    let t = document.getElementById('toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast';
      t.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06210f;padding:9px 14px;border-radius:8px;font-size:14px;z-index:30;transition:opacity .25s';
      document.body.appendChild(t);
    }
    t.textContent = msg; t.style.opacity = '1';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.style.opacity = '0'; }, 1500);
  }

  // Events
  document.getElementById('grid').addEventListener('click', e => {
    const b = e.target.closest('.card');
    if (b) openGame(b.dataset.id);
  });
  document.getElementById('search').oninput = e => { query = e.target.value; shown = PAGE; render(); };
  document.querySelectorAll('.tabs .btn').forEach(b => b.onclick = () => {
    document.querySelectorAll('.tabs .btn').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); filter = b.dataset.f; shown = PAGE; render();
  });
  document.getElementById('moreBtn').onclick = () => { shown += PAGE; render(); };
  document.getElementById('randomBtn').onclick = randomGame;
  document.getElementById('playBtn').onclick = startGame;
  document.getElementById('backBtn').onclick = closePlayer;
  document.getElementById('pFav').onclick = toggleFav;
  document.getElementById('pFull').onclick = toggleFullscreen;
  document.getElementById('resetBtn').onclick = () => {
    if (!confirm('Clear all saved plays, favorites and recent games?')) return;
    saved = { games: {}, recent: [] }; persist(); render(); toast('Progress cleared');
  };
  document.getElementById('quickExit').onclick = () => { location.href = 'https://www.google.com'; };

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !document.getElementById('player').classList.contains('hidden')) { closePlayer(); return; }
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === '/') { e.preventDefault(); document.getElementById('search').focus(); }
    if (e.key === 'r' || e.key === 'R') randomGame();
    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  });

  render();
})();
</script>
